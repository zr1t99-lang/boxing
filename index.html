<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motion Boxing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Every screen is a stack of cards; the match is a 3:4 canvas with a camera strip underneath. */
:root {
  --night: #0a0d2b;
  --night-2: #151b52;
  --red: #ff3b4f;
  --red-deep: #a3162a;
  --gold: #ffc42e;
  --gold-deep: #b07d00;
  --cyan: #3be8ff;
  --mint: #4cf2a0;
  --ink: #f3f5ff;
  --mute: #a4acdc;
  --line: rgba(255, 255, 255, 0.14);
  --panel: rgba(18, 24, 74, 0.82);
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, #24307f 0%, var(--night-2) 38%, var(--night) 100%) fixed, var(--night);
  color: var(--ink);
  font: 400 16px/1.45 var(--body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

.screen { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-height: calc(100vh - 24px); min-height: calc(100dvh - 24px); justify-content: center; }
.logo { font: 400 clamp(40px, 12vw, 68px)/0.95 var(--display); color: var(--gold); text-shadow: 0 4px 0 var(--red-deep), 0 9px 0 rgba(0, 0, 0, 0.35); text-wrap: balance; text-align: center; letter-spacing: 0.01em; }
.title { font: 400 clamp(26px, 7vw, 34px)/1.05 var(--display); color: var(--gold); text-shadow: 0 3px 0 var(--red-deep); text-wrap: balance; }
.sub { color: var(--mute); text-wrap: pretty; max-width: 62ch; }
.center { text-align: center; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 0; min-width: 0; }

.btn { font: 400 20px/1 var(--display); letter-spacing: 0.04em; padding: 15px 22px; border: 0; border-radius: 14px; background: var(--red); color: #fff; box-shadow: 0 6px 0 var(--red-deep); cursor: pointer; transition: transform 0.08s, box-shadow 0.08s; text-align: center; }
.btn:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-deep); }
.btn.gold { background: var(--gold); color: #2a1d00; box-shadow: 0 6px 0 var(--gold-deep); }
.btn.gold:active:not([disabled]) { box-shadow: 0 2px 0 var(--gold-deep); }
.btn.ghost { background: transparent; box-shadow: none; border: 2px solid var(--line); color: var(--ink); font-size: 14px; padding: 11px 16px; letter-spacing: 0.06em; }
.btn.debug { border-style: dashed; border-color: var(--gold); color: var(--gold); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.how div { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 14px; padding: 10px; font-size: 13px; color: var(--mute); }
.how b { display: block; font: 400 15px/1.2 var(--display); color: var(--ink); margin-bottom: 4px; letter-spacing: 0.04em; }
.hero { width: 100%; max-width: 300px; aspect-ratio: 3 / 4; margin: 0 auto; display: block; border-radius: 20px; border: 2px solid var(--line); background: #14083a; }

.chip { display: inline-flex; align-items: center; gap: 8px; font: 700 13px/1 var(--body); letter-spacing: 0.05em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.07); white-space: nowrap; }
.chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--mute); }
.chip.ok { color: var(--mint); border-color: rgba(76, 242, 160, 0.5); }
.chip.ok::before { background: var(--mint); }
.chip.warn { color: var(--gold); border-color: rgba(255, 196, 46, 0.55); }
.chip.warn::before { background: var(--gold); }
.chip.info { color: var(--cyan); border-color: rgba(59, 232, 255, 0.5); }
.chip.info::before { background: var(--cyan); }
.chip.bad { color: var(--red); border-color: rgba(255, 59, 79, 0.6); }
.chip.bad::before { background: var(--red); }

.preview { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #05071c; border-radius: 16px; overflow: hidden; border: 2px solid var(--line); }
.preview video { position: absolute; inset: 0; }
.preview .overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.preview .guide { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.preview.empty::after { content: "No camera image yet"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); font-size: 14px; }
.preview .tag { position: absolute; left: 8px; top: 8px; font: 700 11px/1 var(--body); letter-spacing: 0.08em; padding: 5px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.6); color: #fff; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); min-width: 0; }
.steps li.cur { border-color: var(--gold); background: rgba(255, 196, 46, 0.1); }
.steps li.done { border-color: rgba(76, 242, 160, 0.5); background: rgba(76, 242, 160, 0.08); }
.steps .mark { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 400 14px/1 var(--display); background: rgba(255, 255, 255, 0.1); color: var(--mute); }
.steps li.done .mark { background: var(--mint); color: #05301a; }
.steps li.cur .mark { background: var(--gold); color: #2a1d00; }
.steps .txt { flex: 1 1 0; min-width: 0; }
.steps .txt small { display: block; color: var(--mute); font-size: 12px; }
.lamp { flex: none; width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }
.lamp.on { background: var(--mint); box-shadow: 0 0 12px var(--mint); }

.meter { position: relative; height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(76, 242, 160, 0.35); }
.meter .mk { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--gold); }
.meter .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, 0.35); }
.meter .th { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--cyan); }
.meterlbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); margin-top: 4px; }
.prog { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.prog > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--mint)); width: 0; transition: width 0.1s linear; }

.note { font-size: 13px; color: var(--mute); background: rgba(255, 196, 46, 0.08); border: 1px solid rgba(255, 196, 46, 0.35); border-radius: 12px; padding: 10px 12px; text-wrap: pretty; }
.note.bad { background: rgba(255, 59, 79, 0.1); border-color: rgba(255, 59, 79, 0.5); color: var(--ink); }
.note b { color: var(--ink); }
details.dev { font-size: 13px; color: var(--mute); }
details.dev summary { cursor: pointer; color: var(--ink); font-weight: 500; }
details.dev ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.kbd { display: inline-block; font: 500 12px/1 var(--body); padding: 3px 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); border: 1px solid var(--line); color: var(--ink); }

.matchwrap { width: min(100%, calc((100vh - 170px) * 0.75)); width: min(100%, calc((100dvh - 170px) * 0.75)); margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.matchwrap canvas { width: 100%; aspect-ratio: 3 / 4; display: block; border-radius: 18px; border: 2px solid var(--line); background: #14083a; touch-action: none; }
.strip { display: flex; gap: 10px; align-items: stretch; }
.strip .pip { width: 104px; flex: none; }
.strip .pip .preview { aspect-ratio: auto; height: 78px; border-radius: 12px; }
.strip .info { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.gest { font: 400 15px/1.1 var(--display); color: var(--gold); letter-spacing: 0.04em; min-height: 17px; }
.dbg { border: 2px dashed var(--gold); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--mute); flex: 1 1 0; min-width: 0; }
.dbg b { color: var(--gold); letter-spacing: 0.06em; }

.result-title { font: 400 clamp(44px, 14vw, 80px)/0.95 var(--display); text-align: center; text-shadow: 0 5px 0 rgba(0, 0, 0, 0.4); }
.result-title.win { color: var(--gold); }
.result-title.lose { color: var(--red); }
.result-title.draw { color: var(--cyan); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.stat span { display: block; font-size: 12px; color: var(--mute); letter-spacing: 0.06em; text-transform: uppercase; }
.stat b { font: 400 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat.big { grid-column: 1 / -1; text-align: center; }
.stat.big b { font-size: 38px; color: var(--gold); }

@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .prog > i { transition: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function () {
'use strict';
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;

/* ======================================================================
   CONFIG. Every gesture threshold lives here so it can be tuned.
   Distances are in shoulder-widths (SW), so they scale with body size and
   camera distance. Angles are in degrees.
   ====================================================================== */
var CFG = {
  VISION_URL: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs',
  WASM_URL: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',
  MODEL_URL: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
  smooth: 0.6,          // EMA weight of the newest landmark sample (higher = less lag, more jitter)
  visMin: 0.4,          // minimum landmark visibility to trust a joint
  closeFrac: 0.30,      // shoulder width / frame width above this = "Move Back"
  farFrac: 0.08,        // below this = "Move Closer"
  stillMax: 0.30,       // head movement (SW) allowed while calibrating
  punch: {
    windowMs: 280,      // look-back window for a punch
    cooldown: 380,      // ms between punches from the same arm
    rearmAng: 125,      // elbow must bend below this before the arm can punch again
    extAng: 140,        // elbow angle that counts as extended
    riseAng: 38,        // elbow straightening inside the window
    reachRise: 0.55,    // wrist-to-shoulder growth inside the window (SW)
    minSpeed: 2.0,      // wrist speed (SW per second) for the reach cue
    zRise: 0.38         // wrist moving toward the camera (MediaPipe z, SW); weak cue, noisy
  },
  raiseAbove: 0.35,     // wrist above shoulder line by this much = hand raised
  lean: { on: 0.55, off: 0.32, frames: 3, adapt: 0.02 },
  block: { frames: 3, maxElbow: 120, nearHead: 1.3, belowNose: 0.15 }
};

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function dist(a, b) { return Math.hypot(a.X - b.X, a.Y - b.Y); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function angleAt(b, a, c) {
  var v1x = a.X - b.X, v1y = a.Y - b.Y, v2x = c.X - b.X, v2y = c.Y - b.Y;
  var d = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y);
  if (d < 1e-6) return 0;
  return Math.acos(clamp((v1x * v2x + v1y * v2y) / d, -1, 1)) * 180 / Math.PI;
}
function mkErr(code, message, cause) { var e = new Error(message); e.code = code; e.cause = cause; return e; }

/* ======================================================================
   GESTURE ENGINE (pure logic, no DOM)
   Input: raw MediaPipe landmarks (normalized, camera space, NOT mirrored).
   Everything below works in mirrored pixel space: X = (1 - x) * width, so
   +X is the player's RIGHT. MediaPipe index 12 is the player's anatomical
   right shoulder (it appears on the image's left in an un-mirrored frame),
   so mapping by index keeps left/right anatomically correct.
   ====================================================================== */
function newArm() { return { hist: [], armed: false, lastPunch: -1e9, ang: 0, reach: 0, raised: 0, vis: false, rel: { x: 0, y: -0.5 } }; }

function GestureEngine() {
  this.feat = {
    status: 'camera-ready', sw: 0, swFrac: 0, lean: 0, dodge: null, block: false,
    rRaised: false, lRaised: false, motion: 1, angR: 0, angL: 0, last: '', lastAt: 0, punchCount: 0
  };
  this.baseNoseX = null;
  this.punches = [];
  this.reset();
}
GestureEngine.prototype.reset = function () {
  this.lm = null;
  this.arms = { R: newArm(), L: newArm() };
  this.noseHist = [];
  this.dodge = null; this.cR = 0; this.cL = 0; this.relC = 0;
  this.block = false; this.bOn = 0; this.bOff = 0;
  var f = this.feat;
  f.status = 'camera-ready'; f.dodge = null; f.block = false; f.rRaised = false; f.lRaised = false; f.lean = 0;
};
GestureEngine.prototype.captureBaseline = function () {
  var n = this.noseHist.length;
  if (n < 5) { if (this.lm) this.baseNoseX = this.lm[0].X; return; }
  var s = 0, i;
  for (i = 0; i < n; i++) s += this.noseHist[i].X;
  this.baseNoseX = s / n;
};
GestureEngine.prototype.drainPunches = function () { var q = this.punches; this.punches = []; return q; };
GestureEngine.prototype._note = function (label, t, type, side) {
  this.feat.last = label; this.feat.lastAt = t;
  if (type === 'punch') { this.punches.push({ side: side, t: t }); this.feat.punchCount++; }
};

GestureEngine.prototype.update = function (raw, vw, vh, t) {
  var i, L = this.lm, k = CFG.smooth, f = this.feat;
  if (!L) {
    L = this.lm = [];
    for (i = 0; i < raw.length; i++) {
      var q = raw[i];
      L.push({ X: (1 - q.x) * vw, Y: q.y * vh, Z: q.z * vw, v: q.visibility == null ? 1 : q.visibility });
    }
  } else {
    for (i = 0; i < raw.length; i++) {
      var r = raw[i], o = L[i];
      o.X += ((1 - r.x) * vw - o.X) * k;
      o.Y += (r.y * vh - o.Y) * k;
      o.Z += (r.z * vw - o.Z) * k;
      o.v = r.visibility == null ? 1 : r.visibility;
    }
  }
  var RS = L[12], LS = L[11], nose = L[0];
  var sw = Math.hypot(RS.X - LS.X, RS.Y - LS.Y);
  f.sw = sw; f.swFrac = sw / vw;
  var inF = function (p) { return p.X >= 0 && p.X <= vw && p.Y >= 0 && p.Y <= vh; };
  var parts = [0, 11, 12, 13, 14].every(function (j) { return L[j].v > CFG.visMin; }) && inF(nose) && inF(RS) && inF(LS);
  var status = 'body';
  if (!parts || f.swFrac > CFG.closeFrac) status = 'move-back';
  else if (f.swFrac < CFG.farFrac) status = 'move-closer';
  f.status = status;
  if (sw < 8) return f;

  // head stillness, used by calibration
  this.noseHist.push({ X: nose.X, Y: nose.Y, t: t });
  if (this.noseHist.length > 30) this.noseHist.shift();
  var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (i = 0; i < this.noseHist.length; i++) {
    var nh = this.noseHist[i];
    if (nh.X < minX) minX = nh.X; if (nh.X > maxX) maxX = nh.X;
    if (nh.Y < minY) minY = nh.Y; if (nh.Y > maxY) maxY = nh.Y;
  }
  f.motion = this.noseHist.length < 12 ? 1 : Math.max(maxX - minX, maxY - minY) / sw;

  // ---- arms: punches over several consecutive frames ----
  var P = CFG.punch, sides = ['R', 'L'], si;
  for (si = 0; si < 2; si++) {
    var s = sides[si];
    var idx = s === 'R' ? [12, 14, 16] : [11, 13, 15];
    var S = L[idx[0]], E = L[idx[1]], Wr = L[idx[2]];
    var a = this.arms[s];
    a.vis = E.v > CFG.visMin && Wr.v > CFG.visMin;
    if (!a.vis) { a.hist.length = 0; a.armed = false; continue; }
    var ang = angleAt(E, S, Wr);
    var reach = dist(Wr, S) / sw;
    var zr = (S.Z - Wr.Z) / sw;
    a.ang = ang; a.reach = reach; a.raised = (S.Y - Wr.Y) / sw;
    a.rel.x = (Wr.X - S.X) / sw; a.rel.y = (Wr.Y - S.Y) / sw;
    a.hist.push({ t: t, ang: ang, reach: reach, zr: zr, X: Wr.X, Y: Wr.Y });
    while (a.hist.length && t - a.hist[0].t > P.windowMs + 150) a.hist.shift();

    if (!a.armed && ang < P.rearmAng) a.armed = true;            // reset threshold: arm must be bent again
    if (a.armed && t - a.lastPunch > P.cooldown) {
      var win = [], j;
      for (j = 0; j < a.hist.length; j++) if (t - a.hist[j].t <= P.windowMs) win.push(a.hist[j]);
      if (win.length >= 3) {
        var first = win[0], n = win.length;
        var minAng = 1e9, minReach = 1e9, minZ = 1e9;
        for (j = 0; j < n - 1; j++) {
          if (win[j].ang < minAng) minAng = win[j].ang;
          if (win[j].reach < minReach) minReach = win[j].reach;
          if (win[j].zr < minZ) minZ = win[j].zr;
        }
        var dt = Math.max(0.001, (t - first.t) / 1000);
        var rise = ang - minAng, rr_ = reach - minReach, dz = zr - minZ;
        var speed = Math.hypot(Wr.X - first.X, Wr.Y - first.Y) / sw / dt;
        var up = win[n - 1].ang >= win[n - 3].ang - 2 || win[n - 1].reach >= win[n - 3].reach;
        var A = ang > P.extAng && rise > P.riseAng;                       // elbow snaps straight
        var B = rr_ > P.reachRise && ang > 120 && speed > P.minSpeed;     // wrist shoots away from shoulder
        var C = dz > P.zRise && ang > 125 && rise > 15;                   // wrist comes toward camera
        if (up && (A || B || C)) {
          a.armed = false; a.lastPunch = t;
          this._note(s === 'R' ? 'RIGHT PUNCH' : 'LEFT PUNCH', t, 'punch', s);
        }
      }
    }
  }
  f.angR = this.arms.R.ang; f.angL = this.arms.L.ang;
  f.rRaised = this.arms.R.vis && this.arms.R.raised > CFG.raiseAbove;
  f.lRaised = this.arms.L.vis && this.arms.L.raised > CFG.raiseAbove;

  // ---- lean (dodge): head displacement from the calibrated baseline ----
  if (this.baseNoseX == null) this.baseNoseX = nose.X;
  var ld = (nose.X - this.baseNoseX) / sw;       // + = player's right
  f.lean = ld;
  var LN = CFG.lean;
  if (this.dodge === null) {
    this.cR = ld > LN.on ? this.cR + 1 : 0;
    this.cL = ld < -LN.on ? this.cL + 1 : 0;
    if (this.cR >= LN.frames) { this.dodge = 'R'; this._note('DODGE RIGHT', t, 'dodge'); }
    else if (this.cL >= LN.frames) { this.dodge = 'L'; this._note('DODGE LEFT', t, 'dodge'); }
    if (Math.abs(ld) < 0.28) this.baseNoseX += (nose.X - this.baseNoseX) * LN.adapt;   // slow re-centering
  } else {
    var gone = this.dodge === 'R' ? ld < LN.off : ld > -LN.off;
    this.relC = gone ? this.relC + 1 : 0;
    if (this.relC >= 2) { this.dodge = null; this.relC = 0; this.cR = 0; this.cL = 0; }
  }
  f.dodge = this.dodge;

  // ---- block: both wrists near the head, elbows bent ----
  var aR = this.arms.R, aL = this.arms.L, B_ = CFG.block;
  var nearHead = function (W) {
    return Math.abs(W.X - nose.X) / sw < B_.nearHead && (W.Y - nose.Y) / sw < B_.belowNose && (nose.Y - W.Y) / sw < 1.3;
  };
  var blockNow = aR.vis && aL.vis && nearHead(L[16]) && nearHead(L[15]) && aR.ang < B_.maxElbow && aL.ang < B_.maxElbow;
  if (blockNow) { this.bOn++; this.bOff = 0; } else { this.bOff++; this.bOn = 0; }
  if (!this.block && this.bOn >= B_.frames) { this.block = true; this._note('BLOCK', t, 'block'); }
  else if (this.block && this.bOff >= B_.frames) this.block = false;
  f.block = this.block;
  return f;
};

/* ======================================================================
   TRACKER: camera + MediaPipe Pose Landmarker + overlay drawing

      props.debug ? null : h('button', { className: 'btn ghost grow', onClick: props.onRecal }, 'RECALIBRATE'),
      h('button', { className: 'btn ghost grow', onClick: props.onHome }, 'MAIN MENU')));
}

function App() {
  var tr = useRef(null); if (!tr.current) tr.current = new Tracker();
  var dbg = useRef(null); if (!dbg.current) dbg.current = new DebugInput();
  var tracker = tr.current;
  var s1 = useState('start'), screen = s1[0], setScreen = s1[1];
  var s2 = useState('camera'), mode = s2[0], setMode = s2[1];
  var s3 = useState(null), result = s3[0], setResult = s3[1];
  var s4 = useState(0), round = s4[0], setRound = s4[1];
  useEffect(function () { return function () { tracker.destroy(); dbg.current.detach(); }; }, []);
  var input = mode === 'debug' ? dbg.current : tracker;
  function home() { tracker.releaseCamera(); dbg.current.detach(); setMode('camera'); setScreen('start'); }
  function play() { setRound(function (r) { return r + 1; }); setScreen('match'); }
  if (screen === 'start') return h(StartScreen, { onStart: function () { Sfx.init(); setScreen('permission'); } });
  if (screen === 'permission') return h(Permission, {
    tracker: tracker, onBack: home,
    onReady: function () { tracker.startTracking(); setMode('camera'); setScreen('calibration'); },
    onDebug: function () { tracker.releaseCamera(); dbg.current.attach(); setMode('debug'); play(); }
  });
  if (screen === 'calibration') return h(Calibration, { tracker: tracker, onDone: function () { setScreen('tutorial'); }, onBack: home });
  if (screen === 'tutorial') return h(Tutorial, { tracker: tracker, onDone: play, onBack: function () { setScreen('calibration'); } });
  if (screen === 'match') return h(Match, { key: round, tracker: tracker, input: input, debug: mode === 'debug', onQuit: home, onEnd: function (r) { setResult(r); setScreen('result'); } });
  return h(Result, { result: result, debug: mode === 'debug', onAgain: play, onRecal: function () { setScreen('calibration'); }, onHome: home });
}

window.__MB = { GestureEngine: GestureEngine, createGame: createGame, stepGame: stepGame, CFG: CFG, SilentFx: SilentFx };
var rootEl = document.getElementById('root');
if (rootEl && ReactDOM.createRoot) ReactDOM.createRoot(rootEl).render(h(App));
})();
</script>
